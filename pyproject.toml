[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanaudit"
version = "0.1.0"
description = "Scan your own LAN for exposed services and test them against default/known-weak passwords you supply."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "urllib3>=1.26",
]

[project.optional-dependencies]
ssh = ["paramiko>=3.0"]

[project.scripts]
lanaudit = "lanaudit.__main__:main"

[tool.setuptools]
packages = ["lanaudit", "lanaudit.checkers"]

[tool.setuptools.package-data]
lanaudit = ["data/*.txt"]
